<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glow Astro – Astrology & Birth Chart</title>

    <meta
        name="description"
        content="Glow Astro is an astrology website for submitting birth details and exploring astrology and birth chart information."
    >

    <meta
        name="keywords"
        content="Glow Astro, astrology, birth chart, horoscope, astrology chart"
    >

    <meta name="robots" content="index, follow">

    <!-- Google Search Console verification -->
    <meta
        name="google-site-verification"
        content="ScKnuP52v5SEKenP4W8SBLiTqxdD8tIh0q21a6-_1A"
    >

    <meta property="og:title" content="Glow Astro – Astrology & Birth Chart">
    <meta
        property="og:description"
        content="Welcome to Glow Astro. Submit your birth details for astrology and birth chart information."
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://glow-astro.onrender.com/">

    <link rel="canonical" href="https://glow-astro.onrender.com/">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>✨ Glow Astro</h1>
        <p>Astrology & Birth Chart</p>
    </header>

    <main>

        <section>
            <h2>Welcome to Glow Astro</h2>

            <p>
                Enter your birth details below to continue.
            </p>
        </section>

        <form id="astroForm">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
            >

            <label for="gender">Gender</label>
            <select
                id="gender"
                name="gender"
                required
            >
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="date_of_birth">Date of Birth</label>
            <input
                type="date"
                id="date_of_birth"
                name="date_of_birth"
                required
            >

            <label for="time_of_birth">Time of Birth</label>
            <input
                type="time"
                id="time_of_birth"
                name="time_of_birth"
                required
            >

            <label for="country">Country</label>
            <input
                type="text"
                id="country"
                name="country"
                required
            >

            <label for="state">State / Province / Region</label>
            <input
                type="text"
                id="state"
                name="state"
                required
            >

            <label for="city">City</label>
            <input
                type="text"
                id="city"
                name="city"
                required
            >

            <button type="submit">
                Submit Birth Details
            </button>

            <p id="message"></p>

        </form>

    </main>

    <footer>
        <p>© 2026 Glow Astro</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
