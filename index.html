<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Glow Astro</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">

    <div class="glow-card">

        <h1>✨ Glow Astro</h1>

        <p class="subtitle">
            Discover your cosmic journey
        </p>


        <form id="astroForm">


            <!-- NAME -->

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <!-- GENDER -->

            <label for="gender">
                Gender
            </label>

            <select
                id="gender"
                name="gender"
                required
            >

                <option value="">
                    Select gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- DATE OF BIRTH -->

            <label for="date_of_birth">
                Date of Birth
            </label>

            <input
                type="date"
                id="date_of_birth"
                name="date_of_birth"
                required
            >


            <!-- TIME OF BIRTH -->

            <label for="time_of_birth">
                Time of Birth
            </label>

            <input
                type="time"
                id="time_of_birth"
                name="time_of_birth"
                required
            >


            <!-- COUNTRY -->

            <label for="country">
                Country
            </label>

            <select
                id="country"
                name="country"
                required
            >

                <option value="">
                    Loading countries...
                </option>

            </select>


            <!-- STATE / PROVINCE / REGION -->

            <label for="state">
                State / Province / Region
            </label>

            <select
                id="state"
                name="state"
                required
            >

                <option value="">
                    Select state / province / region
                </option>

            </select>


            <!-- CITY -->

            <label for="city">
                City
            </label>

            <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter your city"
                required
            >


            <!-- SUBMIT -->

            <button type="submit">
                ✨ Submit Details
            </button>


            <!-- MESSAGE -->

            <p id="message"></p>


        </form>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
