<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Glow Astro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="glow-card">

        <h1>✨ Glow Astro</h1>

        <p class="subtitle">
            Discover your cosmic journey
        </p>

        <!-- YouTube -->

        <a
            href="https://www.youtube.com/@GlowAstro9"
            target="_blank"
            rel="noopener noreferrer"
            class="youtube-button"
        >
            ▶️ Visit Our YouTube Channel
        </a>


        <!-- FORM -->

        <form id="astroForm">

            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label for="gender">Gender</label>

            <select
                id="gender"
                name="gender"
                required
            >
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>


            <label for="date_of_birth">
                Date of Birth
            </label>

            <input
                type="date"
                id="date_of_birth"
                name="date_of_birth"
                required
            >


            <label for="time_of_birth">
                Time of Birth
            </label>

            <input
                type="time"
                id="time_of_birth"
                name="time_of_birth"
                required
            >


            <label for="country">
                Country
            </label>

            <select
                id="country"
                name="country"
                required
            >
                <option value="">
                    Loading countries...
                </option>
            </select>


            <label for="state">
                State / Province / Region
            </label>

            <select
                id="state"
                name="state"
                required
            >
                <option value="">
                    Select state / province / region
                </option>
            </select>


            <label for="city">
                City
            </label>

            <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter your city"
                required
            >


            <button type="submit">
                ✨ Submit Details
            </button>

            <p id="message"></p>

        </form>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
