<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glow Astro</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #09051c, #1b0b38, #08051a);
  color: white;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 550px;
  margin: auto;
  padding: 25px 18px 40px;
}

.logo {
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  margin: 15px 0 5px;
  color: #d9a7ff;
  text-shadow: 0 0 20px #9b4dff;
}

.subtitle {
  text-align: center;
  color: #cfc5df;
  margin-bottom: 25px;
}

.card {
  background: rgba(25, 15, 50, 0.95);
  padding: 25px;
  border-radius: 22px;
  box-shadow: 0 0 30px rgba(155, 77, 255, 0.35);
}

label {
  display: block;
  margin-top: 16px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
select {
  width: 100%;
  padding: 13px;
  border: 1px solid #4d3470;
  border-radius: 10px;
  background: #21163b;
  color: white;
  font-size: 15px;
  outline: none;
}

input:focus,
select:focus {
  border-color: #b66cff;
}

select option {
  background: #21163b;
  color: white;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 25px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, #8b3dff, #c05cff);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.youtube {
  text-align: center;
  margin-top: 25px;
}

.youtube a {
  color: #ff7777;
  text-decoration: none;
  font-weight: bold;
}

.note {
  margin-top: 20px;
  font-size: 12px;
  color: #aaa0b5;
  text-align: center;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">✨ Glow Astro ✨</div>

  <div class="subtitle">
    Enter your birth details
  </div>

  <div class="card">

    <label for="name">Name</label>
    <input
      type="text"
      id="name"
      placeholder="Enter your name"
      autocomplete="name"
    >

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob">

    <label for="birthTime">Time of Birth</label>
    <input type="time" id="birthTime">

    <label for="country">Country</label>
    <select id="country">
      <option value="">Select Country</option>
    </select>

    <label for="state">State / Province / Region</label>
    <select id="state" disabled>
      <option value="">Select country first</option>
    </select>

    <label for="city">District / City</label>
    <input
      type="text"
      id="city"
      placeholder="Enter district or city"
      autocomplete="address-level2"
    >

    <button onclick="saveDetails()">
      💾 Save Details
    </button>

  </div>

  <div class="youtube">
    <a
      href="https://www.youtube.com/@GlowAstro9"
      target="_blank"
      rel="noopener"
    >
      ▶ Visit Glow Astro YouTube
    </a>
  </div>

  <div class="note">
    Please enter only the information you are comfortable sharing.
  </div>

</div>

/* ---------------------------------------------------
   ADD FALLBACK FOR COUNTRIES/REGIONS NOT LISTED
--------------------------------------------------- */

const countryList = Object.keys(locations).sort();

const countrySelect = document.getElementById("country");
const stateSelect = document.getElementById("state");


/* Create country dropdown */

countryList.forEach(country => {

  const option = document.createElement("option");

  option.value = country;
  option.textContent = country;

  countrySelect.appendChild(option);

});


/* Country changed */

countrySelect.addEventListener("change", function() {

  const country = this.value;

  stateSelect.innerHTML = "";

  if (!country) {

    stateSelect.disabled = true;

    const option = document.createElement("option");
    option.textContent = "Select country first";

    stateSelect.appendChild(option);

    return;
  }

  stateSelect.disabled = false;

  const firstOption = document.createElement("option");

  firstOption.value = "";
  firstOption.textContent =
    "Select State / Province / Region";

  stateSelect.appendChild(firstOption);


  const states = locations[country] || [];


  states.forEach(state => {

    const option = document.createElement("option");

    option.value = state;
    option.textContent = state;

    stateSelect.appendChild(option);

  });


  const other = document.createElement("option");

  other.value = "Other / Region not listed";
  other.textContent = "Other / Region not listed";

  stateSelect.appendChild(other);

});


/* Save Details */

function saveDetails() {

  const name =
    document.getElementById("name").value.trim();

  const dob =
    document.getElementById("dob").value;

  const birthTime =
    document.getElementById("birthTime").value;

  const country =
    document.getElementById("country").value;

  const state =
    document.getElementById("state").value;

  const city =
    document.getElementById("city").value.trim();


  if (
    !name ||
    !dob ||
    !birthTime ||
    !country ||
    !state ||
    !city
  ) {

    alert("Please fill all details.");

    return;
  }


  const details = {

    name: name,

    dateOfBirth: dob,

    timeOfBirth: birthTime,

    country: country,

    state: state,

    districtOrCity: city,

    savedAt: new Date().toISOString()

  };


  /*
    Current version saves locally in the visitor's browser.
    It does NOT send this information to you yet.
  */

  localStorage.setItem(
    "GlowAstroDetails",
    JSON.stringify(details)
  );


  alert(
    "✨ Your birth details have been saved successfully!"
  );

}
